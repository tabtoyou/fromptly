<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#gradient)"/>

  <!-- Feather icon (quill) -->
  <g transform="translate(64, 64)">
    <!-- Quill feather -->
    <path d="M -10,-30 Q -5,-35 0,-40 Q 5,-35 10,-30 L 5,-10 Q 4,0 3,10 Q 2,15 0,20 Q -2,15 -3,10 Q -4,0 -5,-10 Z"
          fill="white" opacity="0.9"/>
    <path d="M 0,-40 L 0,20 M -8,-28 L 0,-30 M 8,-28 L 0,-30 M -7,-20 L 0,-22 M 7,-20 L 0,-22 M -6,-12 L 0,-14 M 6,-12 L 0,-14"
          stroke="white" stroke-width="1.5" fill="none" opacity="0.7"/>
  </g>

  <!-- Small sparkle -->
  <circle cx="90" cy="35" r="3" fill="white" opacity="0.8"/>
  <circle cx="38" cy="90" r="2" fill="white" opacity="0.6"/>
</svg>
